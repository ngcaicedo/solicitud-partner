name: entrada-solicitudes-partner
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: partner
      POSTGRES_PASSWORD: partner_local
      POSTGRES_DB: partner
    ports:
      - "127.0.0.1:${PARTNER_POSTGRES_PORT:-55434}:5432"
    volumes:
      - partner_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner -d partner"]
      interval: 2s
      timeout: 3s
      retries: 30
  pulsar:
    image: apachepulsar/pulsar:4.1.3
    command: ["bin/pulsar", "standalone", "--advertised-address", "127.0.0.1"]
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
    ports:
      - "127.0.0.1:6650:6650"
      - "127.0.0.1:18086:8080"
    volumes:
      - partner_pulsar:/pulsar/data
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
volumes:
  partner_pulsar:
  partner_postgres:
